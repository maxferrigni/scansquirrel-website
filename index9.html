<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Squirrel — What would you like to digitize?</title>
<meta name="description" content="Tell us what you have. Scan it yourself, or get help from a local Squirrel.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">

<style>
/* ═══ index9 — skeleton: intake only (test) ═══ */
:root {
  --ink:   #1a1a1a;
  --mute:  #6b6660;
  --line:  #e6e2da;
  --acorn: #8b5e3c;
  --acorn2:#a0693f;
  --teal:  #2c6e6a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hanken Grotesk', -apple-system, sans-serif;
  color: var(--ink); background: #fff; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}

/* NAV — logo only */
.nav { padding: 1.5rem; }
.nav .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; text-decoration: none; color: var(--ink); }

/* HERO / INTAKE — the whole page */
.hero { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem 5rem; }
.center { width: 100%; max-width: 560px; text-align: center; }
.hero h1 { font-size: clamp(2rem, 5.5vw, 3.2rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; margin-bottom: 1rem; }
.hero .sub { font-size: 1.1rem; color: var(--mute); margin-bottom: 2.5rem; }

.intake { text-align: left; }
.intake textarea {
  width: 100%; min-height: 120px; padding: 1rem 1.1rem;
  border: 1px solid var(--line); border-radius: 12px;
  font: inherit; font-size: 1rem; color: var(--ink); background: #fff; resize: vertical;
}
.intake textarea::placeholder { color: #a8a29a; }
.intake textarea:focus { outline: none; border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.9rem; }
.chip { font: inherit; font-size: 0.88rem; font-weight: 500; padding: 0.45rem 0.9rem; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--mute); cursor: pointer; }
.chip:hover { border-color: var(--acorn); color: var(--acorn); }
.chip.on { background: var(--acorn); border-color: var(--acorn); color: #fff; }
.chip.on:hover { background: var(--acorn2); border-color: var(--acorn2); color: #fff; }

/* suggestions — prime the box */
.suggest { margin-top: 0.9rem; font-size: 0.9rem; color: var(--mute); }
.suggest .lbl { margin-right: 0.4rem; }
.sugg { font: inherit; font-size: 0.9rem; background: none; border: none; padding: 0; color: var(--acorn); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.sugg + .sugg { margin-left: 0.9rem; }
@media (max-width: 560px){ .sugg { display: block; margin: 0.35rem 0 0; } .sugg + .sugg { margin-left: 0; } }
.go-row { display: flex; align-items: center; gap: 1rem; margin-top: 1.4rem; flex-wrap: wrap; }
.btn { font: inherit; font-size: 0.98rem; font-weight: 600; padding: 0.8rem 1.6rem; border: none; border-radius: 10px; background: var(--acorn); color: #fff; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--acorn2); }
.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.reassure { font-size: 0.88rem; color: var(--mute); }

/* CONVERSATION */
.convo { display: none; text-align: left; }
.convo.show { display: block; }
.bubble { margin-bottom: 1rem; }
.bubble.ai .who { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); margin-bottom: 0.35rem; }
.bubble.ai .msg { font-size: 1.02rem; line-height: 1.55; }
.bubble.me { text-align: right; }
.bubble.me .msg { display: inline-block; background: #f4f2ee; border-radius: 12px; padding: 0.6rem 1rem; font-size: 0.95rem; max-width: 85%; text-align: left; }
.answers { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.3rem 0 1.4rem; }
.zip-row { display: flex; gap: 0.5rem; margin-bottom: 1.4rem; }
.zip-row input { flex: 1; padding: 0.7rem 0.9rem; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 0.98rem; }
.zip-row input:focus { outline: none; border-color: var(--ink); }
.g-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.8rem; }
.restart { margin-top: 1.2rem; font: inherit; font-size: 0.85rem; color: var(--mute); background: none; border: none; cursor: pointer; }
.restart:hover { color: var(--ink); }

/* FOOTER — minimal */
.foot { padding: 1.5rem; text-align: center; font-size: 0.82rem; color: var(--mute); }
.foot a { color: var(--mute); text-decoration: none; }
</style>
</head>
<body>

<nav class="nav"><a class="brand" href="/">Scan Squirrel</a></nav>

<main class="hero">
  <div class="center">
    <h1>What would you like to digitize?</h1>
    <p class="sub">Tell us what you have. We'll help you scan it yourself or find someone local.</p>

    <div class="intake" id="intake">
      <textarea id="projText" placeholder="Three shoeboxes of family photos, two albums, and some old slides — Pasadena, not sure where to begin."></textarea>
      <div class="chips" id="typeChips">
        <button class="chip" type="button">Photos</button>
        <button class="chip" type="button">Slides</button>
        <button class="chip" type="button">Negatives</button>
        <button class="chip" type="button">Documents</button>
        <button class="chip" type="button">Albums</button>
        <button class="chip" type="button">Not sure</button>
      </div>
      <div class="suggest">
        <span class="lbl">Not sure what to say? Try:</span>
        <button class="sugg" type="button" onclick="fillBox(this)">3 shoeboxes of family photos in Pasadena</button>
        <button class="sugg" type="button" onclick="fillBox(this)">A box of old slides and negatives</button>
        <button class="sugg" type="button" onclick="fillBox(this)">My grandma's photo albums</button>
      </div>
      <div class="go-row">
        <button class="btn" onclick="startConvo()">Get Guidance</button>
        <span class="reassure">Free advice. No account needed.</span>
      </div>
    </div>

    <div class="convo" id="convo"></div>
  </div>
</main>

<footer class="foot"><a href="mailto:hello@scansquirrel.com">hello@scansquirrel.com</a> &middot; <a href="tel:+12132902327">(213) 290-2327</a></footer>

<script>
/* ── CAPTURE: paste your endpoint URL below to start recording what people type.
   Easiest: make a free form at formspree.io (30 sec) and paste its URL here.
   Until then, submissions are just logged to the browser console. ── */
var LOG_URL = '';
function logIt(data){
  data.ts = new Date().toISOString();
  data.ua = navigator.userAgent;
  if (LOG_URL){ try { fetch(LOG_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }); } catch(e){} }
  else { console.log('[intake]', data); }
}
function fillBox(el){ var t = document.getElementById('projText'); t.value = el.textContent; t.focus(); }

var selectedTypes = [];
document.querySelectorAll('#typeChips .chip').forEach(function(c){
  c.addEventListener('click', function(){
    c.classList.toggle('on'); var t = c.textContent;
    if (c.classList.contains('on')) selectedTypes.push(t);
    else selectedTypes = selectedTypes.filter(function(x){ return x !== t; });
  });
});
var convo = document.getElementById('convo'), state = {};
function aiBubble(html){ var d=document.createElement('div'); d.className='bubble ai'; d.innerHTML='<div class="who">Scan Squirrel</div><div class="msg">'+html+'</div>'; convo.appendChild(d); d.scrollIntoView({behavior:'smooth',block:'center'}); }
function meBubble(t){ var d=document.createElement('div'); d.className='bubble me'; d.innerHTML='<div class="msg">'+t+'</div>'; convo.appendChild(d); }
function answerRow(options, cb){ var row=document.createElement('div'); row.className='answers'; options.forEach(function(opt){ var b=document.createElement('button'); b.className='chip'; b.textContent=opt; b.onclick=function(){ row.remove(); meBubble(opt); cb(opt); }; row.appendChild(b); }); convo.appendChild(row); row.scrollIntoView({behavior:'smooth',block:'center'}); }
function startConvo(){
  document.getElementById('intake').style.display='none'; convo.classList.add('show');
  var txt=document.getElementById('projText').value.trim();
  var opening = txt || (selectedTypes.length ? selectedTypes.join(', ') : 'A mix of old photos and film');
  state.text = txt; state.types = selectedTypes.slice();
  logIt({ event:'started', text: txt, types: selectedTypes.slice() });
  meBubble(opening);
  setTimeout(function(){ aiBubble("Got it. A couple of quick questions.<br><br><b>Roughly how much do you have?</b>"); answerRow(['A shoebox or two','A closet full','A few albums','Not sure'], q2); },350);
}
function q2(s){ state.size=s; setTimeout(function(){ aiBubble("<b>Scan it yourself, or get local help?</b>"); answerRow(['Myself','Get help','Help me decide'], q3); },300); }
function q3(p){ state.pref=p; setTimeout(function(){
  aiBubble("<b>What ZIP code are you in?</b>");
  var row=document.createElement('div'); row.className='zip-row';
  row.innerHTML='<input id="zipIn" inputmode="numeric" maxlength="5" placeholder="91101"><button class="btn" type="button">Check</button>';
  row.querySelector('button').onclick=function(){ var z=row.querySelector('#zipIn').value.trim()||'91101'; state.zip=z; logIt({ event:'completed', text: state.text, types: state.types, size: state.size, pref: state.pref, zip: z }); row.remove(); meBubble(z); guidance(); };
  convo.appendChild(row); row.querySelector('#zipIn').focus(); row.scrollIntoView({behavior:'smooth',block:'center'});
},300); }
function guidance(){
  var hours = state.size==='A closet full' ? '25–40 hours' : state.size==='A few albums' ? '5–10 hours' : '15–25 hours';
  setTimeout(function(){
    aiBubble("Looks like a <b>medium mixed collection</b>. Doing it yourself well runs about <b>"+hours+"</b> and often needs a film scanner.<br><br>Use Scan Squirrel <b>free for your first 100 photos</b>, or get a quote from a local Squirrel with the gear.<br><br><span style='font-size:0.85rem;color:var(--mute);'>General guidance, not a final price — your Squirrel confirms that.</span><div class='g-actions'><a class='btn' href='#'>Scan 100 Photos Free</a><a class='btn ghost' href='#'>Get a Local Quote</a></div>");
    var r=document.createElement('button'); r.className='restart'; r.textContent='↺ Start over'; r.onclick=function(){ location.reload(); }; convo.appendChild(r);
  },450);
}
</script>

</body>
</html>
