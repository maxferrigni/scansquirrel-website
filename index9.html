<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Squirrel — What would you like to digitize?</title>
<meta name="description" content="Tell us what you have. Scan it yourself, or find someone local.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=DM+Sans:wght@400;500;600;700&display=swap">

<style>
/* ═══ index9 — Google-style front door (test) ═══ */
:root {
  --bone:   #f0ebe3;
  --warm:   #f5f0e8;
  --cream:  #e8e1d5;
  --feather:#2a2a2a;
  --ink:    #1a1a1a;
  --ash:    #6b6660;
  --acorn:  #8b5e3c;
  --acorn2: #a0693f;
  --teal:   #2c6e6a;
  --nest:   #d4c9b8;
  --line:   rgba(42,42,42,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  color: var(--ink); background: var(--bone);
  line-height: 1.55; -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}
h3 { font-family: 'Fraunces', serif; font-weight: 400; letter-spacing: -0.01em; }

/* ── centered search zone ── */
.page { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3rem 1.5rem; }
.col { width: 100%; max-width: 520px; }

.logo { display: block; width: 260px; max-width: 72%; margin: 0 auto 2.4rem; }

/* the box */
.intake { text-align: left; }
.searchbox {
  width: 100%; padding: 1.15rem 1.4rem;
  border: 1px solid var(--line); border-radius: 999px;
  font: inherit; font-size: 1.1rem; color: var(--ink);
  background: #fff; box-shadow: 0 2px 14px rgba(92,74,58,0.07);
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}
.searchbox::placeholder { color: #a89e90; }
.searchbox:focus { outline: none; border-color: var(--acorn); box-shadow: 0 4px 22px rgba(92,74,58,0.14); }

/* ── conversation (revealed) ── */
.convo { display: none; text-align: left; margin-top: 0.5rem; }
.convo.show { display: block; }
.bubble { margin-bottom: 1rem; }
.bubble.ai .who { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; color: var(--teal); margin-bottom: 0.35rem; }
.bubble.ai .msg { font-size: 1.05rem; line-height: 1.55; }
.bubble.me { text-align: right; }
.bubble.me .msg { display: inline-block; background: var(--cream); border-radius: 14px; padding: 0.6rem 1rem; font-size: 0.98rem; max-width: 85%; text-align: left; }
.answers { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.3rem 0 1.4rem; }
.chip { font: inherit; font-size: 0.9rem; font-weight: 500; padding: 0.45rem 0.95rem; border: 1px solid var(--line); border-radius: 10px; background: var(--bone); color: var(--ash); cursor: pointer; }
.chip:hover { border-color: var(--acorn); color: var(--acorn); }
.zip-row { display: flex; gap: 0.5rem; margin-bottom: 1.4rem; }
.zip-row input { flex: 1; padding: 0.75rem 1rem; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 1rem; background: var(--warm); }
.zip-row input:focus { outline: none; border-color: var(--acorn); }
.btn { font: inherit; font-size: 1rem; font-weight: 600; padding: 0.8rem 1.6rem; border: none; border-radius: 12px; background: var(--acorn); color: var(--bone); cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--acorn2); }
.btn.ghost { background: transparent; color: var(--acorn); border: 1px solid var(--line); }
.g-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.9rem; }
.restart { margin-top: 1.3rem; font: inherit; font-size: 0.85rem; color: var(--ash); background: none; border: none; cursor: pointer; }
.restart:hover { color: var(--acorn); }

/* ── dark operator band ── */
.operator { background: var(--feather); color: var(--nest); text-align: center; padding: 3rem 1.5rem; }
.operator .inner { max-width: 460px; margin: 0 auto; }
.operator h3 { font-size: 1.6rem; color: var(--bone); margin-bottom: 0.6rem; }
.operator p { font-size: 0.98rem; color: var(--nest); margin-bottom: 1.3rem; }
.operator .btn.ghost { color: var(--nest); border-color: rgba(212,201,184,0.4); }
.operator .btn.ghost:hover { background: rgba(212,201,184,0.12); }
.operator .indep { font-size: 0.82rem; color: #9a9488; margin-top: 2rem; line-height: 1.5; }
.foot { margin-top: 1.6rem; font-size: 0.85rem; color: var(--nest); }
.foot a { color: var(--nest); text-decoration: none; }
.foot a:hover { color: var(--bone); }
.foot .tags { font-size: 0.78rem; color: #9a9488; margin-top: 0.5rem; }
</style>
</head>
<body>

<main class="page">
  <div class="col">
    <a href="/"><img class="logo" src="/img/logos/rect_acorn_on_bone.png" alt="Scan Squirrel"></a>

    <div class="intake" id="intake">
      <input class="searchbox" id="projText" type="text" autocomplete="off"
             placeholder="What would you like to digitize?"
             onkeydown="if(event.key==='Enter'){event.preventDefault();startConvo();}">
    </div>

    <div class="convo" id="convo"></div>
  </div>
</main>

<!-- operator band -->
<section class="operator">
  <div class="inner">
    <h3>Become a squirrel</h3>
    <p>Use Scan Squirrel tools to help people preserve old photos locally.</p>
    <a class="btn ghost" href="#">Learn about becoming a squirrel</a>
    <p class="indep">Local operators are independent and set their own pricing, scheduling, and services.</p>
    <div class="foot">
      <a href="mailto:hello@scansquirrel.com">hello@scansquirrel.com</a> &middot; <a href="tel:+12132902327">(213) 290-2327</a>
      <div class="tags">Free guidance &middot; Local operators &middot; Scan it yourself</div>
    </div>
  </div>
</section>

<script>
/* ── CAPTURE: paste an endpoint URL to record what people type
   (free form at formspree.io → paste its URL here). Until then, console only. ── */
var LOG_URL = '';
function logIt(data){
  data.ts = new Date().toISOString();
  if (LOG_URL){ try { fetch(LOG_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }); } catch(e){} }
  else { console.log('[intake]', data); }
}

var convo = document.getElementById('convo'), state = {};
function aiBubble(html){ var d=document.createElement('div'); d.className='bubble ai'; d.innerHTML='<div class="who">Scan Squirrel</div><div class="msg">'+html+'</div>'; convo.appendChild(d); d.scrollIntoView({behavior:'smooth',block:'center'}); }
function meBubble(t){ var d=document.createElement('div'); d.className='bubble me'; d.innerHTML='<div class="msg">'+t+'</div>'; convo.appendChild(d); }
function answerRow(options, cb){ var row=document.createElement('div'); row.className='answers'; options.forEach(function(opt){ var b=document.createElement('button'); b.className='chip'; b.textContent=opt; b.onclick=function(){ row.remove(); meBubble(opt); cb(opt); }; row.appendChild(b); }); convo.appendChild(row); row.scrollIntoView({behavior:'smooth',block:'center'}); }

function startConvo(){
  var txt=document.getElementById('projText').value.trim();
  if(!txt){ document.getElementById('projText').focus(); return; }
  document.getElementById('intake').style.display='none';
  convo.classList.add('show');
  state.text = txt;
  logIt({ event:'started', text: txt });
  meBubble(txt);
  setTimeout(function(){ aiBubble("Got it. A couple of quick questions.<br><br><b>Roughly how much do you have?</b>"); answerRow(['A shoebox or two','A closet full','A few albums','Not sure'], q2); },350);
}
function q2(s){ state.size=s; setTimeout(function(){ aiBubble("<b>Scan it yourself, or get local help?</b>"); answerRow(['Myself','Get help','Help me decide'], q3); },300); }
function q3(p){ state.pref=p; setTimeout(function(){
  aiBubble("<b>What ZIP code are you in?</b>");
  var row=document.createElement('div'); row.className='zip-row';
  row.innerHTML='<input id="zipIn" inputmode="numeric" maxlength="5" placeholder="91101"><button class="btn" type="button">Check</button>';
  row.querySelector('button').onclick=function(){ var z=row.querySelector('#zipIn').value.trim()||'91101'; state.zip=z; logIt({ event:'completed', text: state.text, size: state.size, pref: state.pref, zip: z }); row.remove(); meBubble(z); guidance(); };
  convo.appendChild(row); row.querySelector('#zipIn').focus(); row.scrollIntoView({behavior:'smooth',block:'center'});
},300); }
function guidance(){
  var hours = state.size==='A closet full' ? '25–40 hours' : state.size==='A few albums' ? '5–10 hours' : '15–25 hours';
  setTimeout(function(){
    aiBubble("Looks like a <b>medium mixed collection</b>. Doing it yourself well runs about <b>"+hours+"</b> and often needs a film scanner.<br><br>You can scan it yourself with Scan Squirrel, or connect with an independent local operator who has the right equipment.<br><br><span style='font-size:0.85rem;color:var(--ash);'>General guidance, not a final price — operators set their own pricing.</span><div class='g-actions'><a class='btn' href='#'>Start scanning</a><a class='btn ghost' href='#'>Find local help</a></div>");
    var r=document.createElement('button'); r.className='restart'; r.textContent='↺ Start over'; r.onclick=function(){ location.reload(); }; convo.appendChild(r);
  },450);
}
</script>

</body>
</html>
