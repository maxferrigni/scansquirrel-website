<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Scan Squirrel · Eight MomsLA concepts</title><style>*{box-sizing:border-box}body{margin:0;background:#f0ebe3;color:#492b25;font:16px/1.45 system-ui}main{max-width:700px;margin:auto;padding:14px 10px 40px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}a{color:inherit}h1{font:26px/1.2 Georgia;margin:20px 0 10px}.intro{font-size:14px;margin:8px 0}.controls{position:sticky;top:0;z-index:3;background:#f0ebe3f5;padding:8px 0}.controls button{font:600 14px/1.2 system-ui;border:1px solid #b8a797;border-radius:5px;padding:10px;background:white;color:#492b25}.controls button.active{background:#492b25;color:white}.status{font-size:12px;margin:5px 0}.card{background:white;margin:16px 0 26px;border-radius:6px;overflow:hidden}.label{font:600 14px/1.35 system-ui;margin:0;padding:12px}.image{display:block;width:100%;height:auto}.under{padding:16px}.under p{font-size:18px;line-height:1.5;margin:0 0 16px}.logo{width:180px;max-width:60%;height:auto;display:block;margin:14px auto}.cta{display:table;max-width:100%;margin:0 auto;padding:12px 20px;background:#492b25;color:white;font-size:18px;font-weight:700;border-radius:4px;text-align:center}.notes{padding:12px;background:#faf7f2}.notes button{font:14px system-ui;padding:8px 12px;border:1px solid #b8a797;background:white;color:#492b25;border-radius:5px}.notes button.active{background:#492b25;color:white}.notes textarea{display:block;width:100%;min-height:64px;font:16px/1.4 system-ui;padding:8px;border:1px solid #b8a797;margin-top:8px;border-radius:4px}.hint{font-size:12px;padding:0 12px 10px;margin:0}details summary{cursor:pointer;font-size:14px}button{cursor:pointer}</style><main><div class="top"><a href="/review/">All reviews</a><strong>Eight-week MomsLA concepts</strong></div><h1>Big photo. Short headline. Clear next step.</h1><p class="intro">One recommended concept for each week. The picture and headline stay together inside the 700 × 400 upload.</p><div class="controls"><button id="inside" class="active">Logo in upload</button> <button id="separate">Logo below image</button><p class="status" id="modeNote">This option fits the single image field; logo is part of the uploaded artwork.</p><p class="status" id="save">Loading saved notes…</p></div><div id="cards"></div></main><script>class ReviewFeedbackSync {
  constructor({endpoint, key, initial, onStatus, onLoad, fetcher=fetch, storage=localStorage}) {
    Object.assign(this,{endpoint,key,onStatus,onLoad,fetcher,storage});
    this.state=structuredClone(initial);this.pending=null;this.running=false;this.retry=null;this.ackAt=null;
  }
  merge(local,remote) {
    const valid=x=>x && x.round===this.state.round;
    if(!valid(local))return valid(remote)?remote:this.state;
    if(!valid(remote))return local;
    const newer=(local.updatedAt||'')>(remote.updatedAt||'')?local:remote;
    const answers={...remote.answers};
    for(const [id,answer] of Object.entries(local.answers||{})) {
      const old=answers[id];
      if(!old || (answer.editedAt||local.updatedAt||'') >= (old.editedAt||remote.updatedAt||''))answers[id]=answer;
    }
    return {...newer,answers};
  }
  backup(){try{this.storage.setItem(this.key,JSON.stringify(this.state))}catch{}}
  async load(){
    let cached,remote;
    try{cached=JSON.parse(this.storage.getItem(this.key))}catch{}
    try{const res=await this.fetcher(this.endpoint,{cache:'no-store'});if(!res.ok)throw Error('load');remote=await res.json()}catch{}
    this.state=this.merge(this.merge(cached,this.state),remote);this.backup();this.onLoad?.(structuredClone(this.state));
    if(JSON.stringify(this.state.answers||{})!==JSON.stringify(remote?.answers||{}))this.update(this.state);
    else this.onStatus?.(remote?.round===this.state.round?'Saved for Jen ✓':'Ready');
    return this.state;
  }
  update(value){const next=structuredClone(value);for(const [id,a]of Object.entries(next.answers||{})){const old=this.state.answers?.[id];a.editedAt=(!old||a.choice!==old.choice||a.notes!==old.notes)?next.updatedAt:(old.editedAt||this.state.updatedAt||next.updatedAt)}this.state=next;this.backup();this.pending=JSON.stringify(this.state);this.onStatus?.('Saving…');clearTimeout(this.debounce);this.debounce=setTimeout(()=>this.flush(),250)}
  async flush(){
    clearTimeout(this.debounce);clearTimeout(this.retry);
    if(this.running)return;
    this.running=true;
    try {
      while(this.pending){
        const body=this.pending;this.pending=null;
        try {
          const res=await this.fetcher(this.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:true});
          if(!res.ok)throw Error('save');
          const ack=await res.json();if(ack.saved!==true)throw Error('no acknowledgement');
          this.ackAt=JSON.parse(body).updatedAt;
          if(!this.pending)this.onStatus?.('Saved for Jen ✓');
        }catch{
          if(!this.pending)this.pending=body;
          this.onStatus?.('Saved on phone · waiting to sync');
          this.retry=setTimeout(()=>this.flush(),3000);break;
        }
      }
    }finally{this.running=false}
  }
  leave(){
    this.backup();
    if(this.pending)this.fetcher(this.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:this.pending,keepalive:true}).catch(()=>{});
  }
}
if(typeof module!=='undefined')module.exports={ReviewFeedbackSync};
